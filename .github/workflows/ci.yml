name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend core tests
        run: python tests/backend_core_test.py
      - name: Backend API tests
        run: python tests/backend_api_test.py
      - name: Backend regression and HTTP tests
        run: |
          python tests/test_backend_regression.py
          python tests/test_backend_http.py
      - name: Python syntax
        run: python -m compileall backend server.py tests/backend_core_test.py tests/backend_api_test.py
      - name: Verify standalone build
        run: |
          python build_standalone.py
          git diff --exit-code -- shiling_mobile.html
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser tests
        run: |
          python tests/smoke_test.py
          python tests/backend_ui_test.py
          python tests/standalone_check.py
