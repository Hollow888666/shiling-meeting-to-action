name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Backend core tests
        run: python tests/backend_core_test.py
      - name: Backend material tests
        run: python tests/backend_materials_test.py
      - name: Backend API tests
        run: python tests/backend_api_test.py
      - name: Python syntax
        run: python -m compileall backend server.py tests/backend_core_test.py tests/backend_api_test.py
